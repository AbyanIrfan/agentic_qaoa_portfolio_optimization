[project]
name = "agentic-qaoa"
version = "0.1.0"
description = "Agentic AI framework for automated QAOA design in portfolio optimization"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "graph*", "llm*", "config*", "tools*", "benchmark*", "rag*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"